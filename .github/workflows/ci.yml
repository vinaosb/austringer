# CI — lint gates, nextest archive matrix, wasm-plugin tests, coverage,
# frontends (VS Code tests + web e2e), doctests, perf gate.
#
# Design notes:
#  * Toolchain pinned to the workspace MSRV (Cargo.toml rust-version = 1.98)
#    via the same `rustup update <ver> && rustup default <ver>` pattern
#    cargo-dist generates in release.yml.
#  * Test strategy: `cargo nextest archive` per OS, then run-from-archive —
#    build and execution are separated, and the archive is uploaded so a
#    failure can be replayed locally with `cargo nextest run --archive-file`.
#  * Coverage via cargo-llvm-cov's nextest backend; LCOV report uploaded as
#    a workflow artifact (no third-party uploader — no token exists yet).
#  * austringer-wasm's wasmtime runtime is default-off (wasm-plugins feature,
#    plan todo 45): the workspace archive compiles its `#![cfg(feature)]`
#    suites away, so the test job runs them feature-on in a separate step
#    (clippy gate rides in the lint job next to the austringer-bench matrix).
#  * Doctests are invisible to nextest (longstanding upstream limitation):
#    a plain `cargo test --doc` step covers them (ubuntu only — the doctest
#    corpus is platform-independent; the Windows gate runs locally).
#  * frontends job (todo 25): VS Code `npm ci && npm test` plus the web
#    e2e Playwright run, windows-latest (repo is Windows-first).
#    playwright-core resolves exactly as on dev (global npm tree via
#    NODE_PATH) and the browser is the runner's Chrome stable through the
#    run-e2e.mjs PLAYWRIGHT_CHROMIUM override.
#  * --locked on every cargo invocation that resolves dependencies: CI
#    fails on a stale Cargo.lock instead of silently rewriting it.
#    cargo fmt needs no lockfile; `nextest run --archive-file` executes
#    prebuilt binaries from the archive, not the manifest.
#  * Live-model evals jobs DO NOT belong here: the landed evals crate
#    (todo 44) gets its jobs in a SEPARATE SCHEDULED-only workflow
#    (todo 26; goose policy — live-model sweeps never gate PRs). Do not
#    add them to this file's PR path.
#
# PROCESS NOTE — vendored-upstream duplication gate (Kilo kilocode_change
# discipline, research §11): this repo currently vendors NO upstream code.
# If an upstream austringer is ever vendored into this tree, vendored files
# must carry annotated-change markers (upstream-ref + marker comments per
# local hunk), and a duplication-check job gets added to this lint workflow:
# diff vendored paths against the pinned upstream ref, fail when a hunk
# lacks its annotation. This gate stays dormant while nothing is vendored.
#
# Action versions (majors; exact list verified against upstream tags
# 2026-09-12): actions/checkout@v6, actions/upload-artifact@v7,
# Swatinem/rust-cache@v2, taiki-e/install-action@v2. Todo 25 adds
# actions/setup-node@v7 (latest major verified against upstream
# releases 2026-10-22).
# Tool pins: cargo-nextest@0.9.144, cargo-deny@0.20.2, cargo-llvm-cov@0.9.1
# (cargo-deny and nextest versions match the local dev environment).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required checks must also run on merge-queue entries or the queue
  # can never satisfy them.
  merge_group:

# Superseded runs on the same ref cancel; PR pushes do not cancel main runs
# (distinct refs → distinct groups).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Test builds do not need DWARF debuginfo; dropping it roughly halves
  # target-dir size, which cold-cache ubuntu runs need to stay inside the
  # runner disk (the full debug workspace blew it: "No space left on
  # device" mid-link). Coverage instrumentation embeds its own mapping
  # sections and does not read DWARF. Release builds (perf-gate) are
  # unaffected by the dev/test profile knobs.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: fmt + clippy + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98 (workspace MSRV)
        # GitHub runner images default to rustup's minimal profile, which
        # ships no rustfmt/clippy for newly installed toolchains.
        run: rustup update 1.98 --no-self-update && rustup default 1.98 && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: "clippy (austringer-bench feature matrix: dhat, mimalloc)"
        # Feature-gated gate code (global allocators) must stay lint-clean
        # too; the two features are mutually exclusive by compile_error!.
        run: |
          cargo clippy --locked -p austringer-bench --all-targets --features dhat -- -D warnings
          cargo clippy --locked -p austringer-bench --all-targets --features mimalloc -- -D warnings
      - name: "clippy (austringer-wasm feature: wasm-plugins)"
        # Same discipline for the default-off wasmtime runtime (todo 25):
        # without this the entire plugin engine has 0% lint coverage.
        run: cargo clippy --locked -p austringer-wasm --all-targets --features wasm-plugins -- -D warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny (advisories, bans, licenses)
        run: cargo deny check

  test:
    name: nextest archive (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Reclaim runner disk (ubuntu only)
        # Cold-cache full-workspace builds plus the preinstalled SDKs
        # exceed the ~14 GB free; removing the largest unused preinstalls
        # (android ~9 GB, dotnet, graalvm, ghc) keeps the build inside it.
        if: matrix.os == 'ubuntu-latest'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/graalvm /opt/ghc
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98 (workspace MSRV)
        run: rustup update 1.98 --no-self-update && rustup default 1.98
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.144
      - name: Build test archive
        run: cargo nextest archive --workspace --locked --archive-file nextest-archive.tar.zst
      - name: Run tests from archive
        run: cargo nextest run --archive-file nextest-archive.tar.zst
      - name: Run wasm-plugin tests (feature-gated out of the archive)
        # austringer-wasm's wasmtime suites are `#![cfg(feature)]` inner-gated
        # and wasm-plugins is default-off, so the workspace archive above
        # compiles them away — run them with the feature on (todo 25). The
        # run-count assertion guards against the suites silently shrinking
        # to zero tests again.
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 cargo nextest run --locked -p austringer-wasm --features wasm-plugins 2>&1 | tee wasm-nextest.log
          runs=$(sed $'s/\x1b\[[0-9;]*m//g' wasm-nextest.log | grep -Eo '[0-9]+ tests? run' | tail -n1 | grep -Eo '^[0-9]+')
          if [ -z "$runs" ] || [ "$runs" -eq 0 ]; then
            echo "::error::austringer-wasm --features wasm-plugins ran ${runs:-0} tests (expected >0)"
            exit 1
          fi
          echo "austringer-wasm feature-gated tests executed: $runs"
      - name: Doc tests (ubuntu only)
        # nextest cannot execute doctests (upstream limitation); plain
        # cargo test covers them. Ubuntu-only: the doctest corpus is
        # platform-independent and the Windows gate runs as todo 25's
        # local acceptance.
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --workspace --locked
      - name: Upload test archive
        # Replayable artifact: `cargo nextest run --archive-file ...` locally.
        # 1-day retention: each archive is ~400 MB and three of them per run
        # exhausted the private repo's Actions storage quota (2026-09-21);
        # replay value decays within a day, storage cost does not.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive-${{ matrix.os }}
          path: nextest-archive.tar.zst
          retention-days: 1

  frontends:
    # Todo 25: VS Code extension suites (`npm ci && npm test`; node's
    # built-in runner — host-free plain TS) plus the web e2e Playwright
    # run. windows-latest: the repo is Windows-first and run-e2e.mjs's
    # fixture exe is a Windows build.
    name: frontends (vscode tests + web e2e)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Matches the dev environment the suites are written against
          # (node:test running .ts needs >=23.6 type stripping).
          node-version: 25
      - name: Install Rust 1.98 (workspace MSRV)
        run: rustup update 1.98 --no-self-update && rustup default 1.98
      - uses: Swatinem/rust-cache@v2
      - name: Build web e2e fixture daemon
        run: cargo build --locked -p austringer-web --example e2e_daemon
      - name: VS Code extension tests
        working-directory: austringer-vscode
        run: |
          npm ci
          npm test
      - name: Install playwright-core (global, dev-version-pinned)
        # run-e2e.mjs resolves playwright-core from the global npm tree
        # via NODE_PATH — same resolution as the dev machine. Pinned to
        # the dev-verified 1.63.0.
        shell: bash
        run: |
          npm install -g playwright-core@1.63.0
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Web e2e (runner Chrome via PLAYWRIGHT_CHROMIUM)
        # No ms-playwright browser cache on runners: point the existing
        # override at the runner's Chrome stable.
        env:
          AUSTRINGER_E2E_EXE: ${{ github.workspace }}\target\debug\examples\e2e_daemon.exe
          PLAYWRIGHT_CHROMIUM: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: node austringer-web/e2e/run-e2e.mjs

  coverage:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim runner disk
        # The instrumented coverage tree is a second full debug build;
        # see the test matrix's reclaim step.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/graalvm /opt/ghc
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98 (workspace MSRV)
        run: rustup update 1.98 --no-self-update && rustup default 1.98
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          # llvm-cov's nextest backend invokes cargo-nextest as the runner.
          tool: cargo-nextest@0.9.144,cargo-llvm-cov@0.9.1
      - name: Generate LCOV report (nextest backend)
        run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  perf-gate:
    # Todo 43: real perf gate — todo-43 budgets (cold start <50 ms, idle
    # renders, RSS <80 MB, p99 frame <16 ms, 10 ms frame budget w/ hang
    # detection, binary <40 MB stripped) + >10% regressions vs committed
    # machine-independent baselines (deterministic counters only; wall
    # clock rides absolute budgets w/ min-of-N — noise-margin discipline,
    # austringer-bench/src/lib.rs). windows-latest matches the platform the
    # committed baselines were recorded on (allocation counts are
    # allocator/OS-sensitive; re-record procedure in
    # austringer-bench/baselines/README.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98 (workspace MSRV)
        run: rustup update 1.98 --no-self-update && rustup default 1.98
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries (austringer, austringer-daemon, gate)
        run: cargo build --release --locked -p austringer-cli -p austringer-daemon -p austringer-bench
      - name: Perf gate (budgets + regression vs committed baseline)
        run: >-
          cargo run --release --locked -q -p austringer-bench --bin perf-gate --
          --budgets austringer-bench/budgets.json
          --baseline austringer-bench/baselines/gate_baseline.json
          --cli-bin target/release/austringer.exe
          --daemon-bin target/release/austringer-daemon.exe
          --binary austringer=target/release/austringer.exe
          --binary austringer-daemon=target/release/austringer-daemon.exe
          --report perf-report.json
      - name: Heap-profile allocation regression gate (dhat)
        run: >-
          cargo run --release --locked -q -p austringer-bench --bin heap-profile --features dhat --
          --check austringer-bench/baselines/heap_profile.json
          --report heap-profile-report.json
      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-reports
          path: |
            perf-report.json
            heap-profile-report.json
