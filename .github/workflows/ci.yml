# CI — lint gates, nextest archive matrix, coverage, perf-gate stub.
#
# Design notes:
#  * Toolchain pinned to the workspace MSRV (Cargo.toml rust-version = 1.98)
#    via the same `rustup update <ver> && rustup default <ver>` pattern
#    cargo-dist generates in release.yml.
#  * Test strategy: `cargo nextest archive` per OS, then run-from-archive —
#    build and execution are separated, and the archive is uploaded so a
#    failure can be replayed locally with `cargo nextest run --archive-file`.
#  * Coverage via cargo-llvm-cov's nextest backend; LCOV report uploaded as
#    a workflow artifact (no third-party uploader — no token exists yet).
#  * Live-model evals jobs DO NOT belong here: when todo 44 (evals +
#    conformance) lands, its jobs go in a SEPARATE SCHEDULED-only workflow
#    (goose policy — live-model sweeps never gate PRs). Do not add them to
#    this file's PR path.
#
# PROCESS NOTE — vendored-upstream duplication gate (Kilo kilocode_change
# discipline, research §11): this repo currently vendors NO upstream code.
# If an upstream harness is ever vendored into this tree, vendored files
# must carry annotated-change markers (upstream-ref + marker comments per
# local hunk), and a duplication-check job gets added to this lint workflow:
# diff vendored paths against the pinned upstream ref, fail when a hunk
# lacks its annotation. This gate stays dormant while nothing is vendored.
#
# Action versions (majors; exact list verified against upstream tags
# 2026-09-12): actions/checkout@v6, actions/upload-artifact@v7,
# Swatinem/rust-cache@v2, taiki-e/install-action@v2.
# Tool pins: cargo-nextest@0.9.144, cargo-deny@0.20.2, cargo-llvm-cov@0.9.1
# (cargo-deny and nextest versions match the local dev environment).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref cancel; PR pushes do not cancel main runs
# (distinct refs → distinct groups).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Test builds do not need DWARF debuginfo; dropping it roughly halves
  # target-dir size, which cold-cache ubuntu runs need to stay inside the
  # runner disk (the full debug workspace blew it: "No space left on
  # device" mid-link). Coverage instrumentation embeds its own mapping
  # sections and does not read DWARF. Release builds (perf-gate) are
  # unaffected by the dev/test profile knobs.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: fmt + clippy + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98 (workspace MSRV)
        # GitHub runner images default to rustup's minimal profile, which
        # ships no rustfmt/clippy for newly installed toolchains.
        run: rustup update 1.98 --no-self-update && rustup default 1.98 && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: "clippy (harness-bench feature matrix: dhat, mimalloc)"
        # Feature-gated gate code (global allocators) must stay lint-clean
        # too; the two features are mutually exclusive by compile_error!.
        run: |
          cargo clippy -p harness-bench --all-targets --features dhat -- -D warnings
          cargo clippy -p harness-bench --all-targets --features mimalloc -- -D warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny (advisories, bans, licenses)
        run: cargo deny check

  test:
    name: nextest archive (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Reclaim runner disk (ubuntu only)
        # Cold-cache full-workspace builds plus the preinstalled SDKs
        # exceed the ~14 GB free; removing the largest unused preinstalls
        # (android ~9 GB, dotnet, graalvm, ghc) keeps the build inside it.
        if: matrix.os == 'ubuntu-latest'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/graalvm /opt/ghc
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98 (workspace MSRV)
        run: rustup update 1.98 --no-self-update && rustup default 1.98
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.144
      - name: Build test archive
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst
      - name: Run tests from archive
        run: cargo nextest run --archive-file nextest-archive.tar.zst
      - name: Upload test archive
        # Replayable artifact: `cargo nextest run --archive-file ...` locally.
        # 1-day retention: each archive is ~400 MB and three of them per run
        # exhausted the private repo's Actions storage quota (2026-09-21);
        # replay value decays within a day, storage cost does not.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive-${{ matrix.os }}
          path: nextest-archive.tar.zst
          retention-days: 1

  coverage:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim runner disk
        # The instrumented coverage tree is a second full debug build;
        # see the test matrix's reclaim step.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/graalvm /opt/ghc
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98 (workspace MSRV)
        run: rustup update 1.98 --no-self-update && rustup default 1.98
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          # llvm-cov's nextest backend invokes cargo-nextest as the runner.
          tool: cargo-nextest@0.9.144,cargo-llvm-cov@0.9.1
      - name: Generate LCOV report (nextest backend)
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  perf-gate:
    # Todo 43: real perf gate — todo-43 budgets (cold start <50 ms, idle
    # renders, RSS <80 MB, p99 frame <16 ms, 10 ms frame budget w/ hang
    # detection, binary <40 MB stripped) + >10% regressions vs committed
    # machine-independent baselines (deterministic counters only; wall
    # clock rides absolute budgets w/ min-of-N — noise-margin discipline,
    # harness-bench/src/lib.rs). windows-latest matches the platform the
    # committed baselines were recorded on (allocation counts are
    # allocator/OS-sensitive; re-record procedure in
    # harness-bench/baselines/README.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98 (workspace MSRV)
        run: rustup update 1.98 --no-self-update && rustup default 1.98
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries (harness, harness-daemon, gate)
        run: cargo build --release -p harness-cli -p harness-daemon -p harness-bench
      - name: Perf gate (budgets + regression vs committed baseline)
        run: >-
          cargo run --release -q -p harness-bench --bin perf-gate --
          --budgets harness-bench/budgets.json
          --baseline harness-bench/baselines/gate_baseline.json
          --cli-bin target/release/harness.exe
          --daemon-bin target/release/harness-daemon.exe
          --binary harness=target/release/harness.exe
          --binary harness-daemon=target/release/harness-daemon.exe
          --report perf-report.json
      - name: Heap-profile allocation regression gate (dhat)
        run: >-
          cargo run --release -q -p harness-bench --bin heap-profile --features dhat --
          --check harness-bench/baselines/heap_profile.json
          --report heap-profile-report.json
      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-reports
          path: |
            perf-report.json
            heap-profile-report.json
