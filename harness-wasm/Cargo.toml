[package]
name = "harness-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
harness-core = { path = "../harness-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
# The wasmtime engine is OPTIONAL and DEFAULT OFF: the plugin runtime must not
# weight the default build (plan todo 45, Must-NOT-enable-by-default). The
# `wasm-plugins` feature is the single gate; without it this crate carries
# only the manifest/capability/interface-ladder types.
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
# Compiles in the wasmtime runtime (see the workspace Cargo.toml entry for the
# feature-minimality rationale). House pattern: harness-safety `container`.
wasm-plugins = ["dep:wasmtime"]
