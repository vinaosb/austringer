[package]
name = "austringer-test-support"
description = "Shared hermetic test kits for the austringer workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }

# M15 mocktool: hermetic external-tool stand-in (argv-driven canned
# outputs; golden files under golden/mocktool are real captures â€” see
# golden/mocktool/capture.md). Test-support probe binary, not a release
# artifact â€” cargo-dist must skip it.
[[bin]]
name = "mocktool"
path = "src/bin/mocktool.rs"

[package.metadata.dist]
dist = false
