# nextest configuration (workspace-wide).
#
# The austringer-exec live-PTY suites (pty_chaos, pty_qa, pty_live,
# pathologies) spawn and enumerate real process trees (PING.EXE on
# Windows, sleep on Unix). nextest runs every test in its own process,
# so the in-binary LiveGate (todo 20 flake fix) cannot see across test
# boundaries: a concurrently running fixture's live pings contaminate
# another test's machine baseline (observed on CI windows-latest:
# "baseline 2" sampled from a sibling test's tree). Serializing the
# whole family at the scheduler level restores the enumeration oracle
# and keeps the documented conhost-contention fix intact.

[test-groups]
pty-live = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(austringer-exec) and binary(/^(pty_chaos|pty_qa|pty_live|pathologies)$/)'
test-group = "pty-live"
