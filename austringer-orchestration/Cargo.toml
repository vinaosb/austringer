[package]
name = "austringer-orchestration"
description = "Spec-driven launch, roles, and phases for austringer orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Todo-40 launcher consumes the T34 model-profiles stack read-only: the
# seeded catalog (fail-closed model/effort resolution), the dial
# effort-bundle grammar (ChildKnobs are resolved dial positions), and the
# SET/PROMPT/THROTTLE elicitation constitution (effort scaling + the
# THROTTLE structural budgets that seed the launcher's hard guards).
austringer-intel = { path = "../austringer-intel", version = "0.1.0" }
# ModelIdentity is the resolved identity type carried by every ChildJob
# knob bundle; default-features = false keeps reqwest out of this crate
# (the orchestration layer never talks to providers directly â€” executors
# and backends own transport).
austringer-providers = { path = "../austringer-providers", version = "0.1.0", default-features = false }
# Deny-only permission inheritance and escalation bubbling reuse the real
# grammar types (Rule/Action/Target) instead of forking a parallel
# vocabulary; the engine itself is not constructed here.
austringer-safety = { path = "../austringer-safety", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
# Spec fingerprints (stale-reload detection) and artifact content hashes.
blake3.workspace = true
# External-backend release-asset SHA-256 verification (auto-install gate).
sha2.workspace = true
# Wave concurrency (JoinSet) + semaphore-bounded parallel children.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util"] }
