[package]
name = "harness-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Engine surfaces under measurement (todo 43 bench set).
harness-core = { path = "../harness-core", version = "0.1.0" }
harness-daemon = { path = "../harness-daemon", version = "0.1.0" }
harness-exec = { path = "../harness-exec", version = "0.1.0" }
harness-repomap = { path = "../harness-repomap", version = "0.1.0" }
harness-sessions = { path = "../harness-sessions", version = "0.1.0" }
harness-tui = { path = "../harness-tui", version = "0.1.0" }
# Frame rendering over the TUI's TestBackend path.
crossterm.workspace = true
ratatui.workspace = true
# Eviction engine is async; scenarios drive it with a minimal runtime.
tokio = { workspace = true, features = ["rt"] }
# Mock eviction seams (Condenser impls are #[async_trait]-desugared).
async-trait.workspace = true
# Daemon RSS sampling (targeted single-pid refresh, todo-18 pattern).
sysinfo.workspace = true
# Gate plumbing.
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tempfile.workspace = true
# Archived heap profiles (heap-profile bin; global allocator — mutually
# exclusive with mimalloc by construction).
dhat = { workspace = true, optional = true }
# Allocation-discipline option for the gate binaries (default off: the
# default gate measures the system allocator like production builds).
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
criterion = { workspace = true }

[features]
default = []
dhat = ["dep:dhat"]
mimalloc = ["dep:mimalloc"]

# Criterion benches over the six plan surfaces. Thin wrappers around the
# scenario runners so gates and benches measure identical work.
[[bench]]
name = "repomap"
harness = false

[[bench]]
name = "eviction"
harness = false

[[bench]]
name = "prompt"
harness = false

[[bench]]
name = "pty"
harness = false

[[bench]]
name = "sessions"
harness = false

[[bench]]
name = "tui"
harness = false

# dhat installs the global allocator; the profile binary only exists
# under the feature.
[[bin]]
name = "heap-profile"
required-features = ["dhat"]
