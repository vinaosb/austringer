[package]
name = "austringer-safety"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Todo-26 container backend: Docker/Podman arg generation + optional
# daemon smoke test. Off by default; `--features container` opts in.
container = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hmac.workspace = true
sha2.workspace = true
base64ct.workspace = true
getrandom.workspace = true
# Todo-27 permission grammar URL targets: real URL parsing (scheme/host/
# port normalization, IPv6 handling) — string prefixing is a security smell.
url.workspace = true
# Todo-27 permission grammar OPT-IN regex rules (off by default; prefix
# matching is the default). Pure Rust.
regex.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "austringer-safety-probe"
path = "src/bin/probe.rs"

# Test-support probe binary, not a release artifact — cargo-dist must skip it.
[package.metadata.dist]
dist = false
