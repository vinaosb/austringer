[package]
name = "harness-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Adapter direction: providers -> core. harness-core owns the Inference seam
# (todo 5 contract: llm_visible context, abandon-on-cancel, complete-or-error)
# and is frozen for this task, so the resilient transport stack binds to it
# HERE. The direction is permanent: core must never depend on providers.
harness-core = { path = "../harness-core", version = "0.1.0" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
blake3.workspace = true

[dev-dependencies]
harness-test-support = { path = "../harness-test-support", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }
