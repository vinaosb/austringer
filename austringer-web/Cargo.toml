[package]
name = "austringer-web"
description = "Daemon-served web dashboard SPA for austringer (no node server)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Content-addressed asset routes (blake3[0..12] of each artifact's bytes);
# pure Rust, already in the workspace tree.
blake3.workspace = true
# base64 for the data:-URL import map of the self-contained entry
# document (workspace dep, pure Rust, alloc only).
base64ct.workspace = true

[dev-dependencies]
# Dev-cycle (cargo supports dev-dependency cycles): the daemon SERVES
# these assets (austringer-daemon -> austringer-web regular dep); its web
# module is exercised read-only here to prove SERVED CONTENT + headers.
# Deliberately PATH-ONLY: a version key would become a registry
# requirement in the packaged manifest and deadlock the first publish
# (daemon needs web on crates.io; web would need daemon). cargo strips
# version-less path dev-deps at package time; deny.toml's
# allow-wildcard-path-deps permits exactly this shape.
austringer-daemon = { path = "../austringer-daemon" }
# E2E example: scripted inference + worker over the daemon router.
austringer-core = { path = "../austringer-core", version = "0.1.0" }
austringer-providers = { path = "../austringer-providers", version = "0.1.0" }
axum.workspace = true
base64ct.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
serde_json.workspace = true
tempfile.workspace = true
# HTTP probes for the QA transcript in the e2e example.
reqwest.workspace = true
# SSE stream consumption in the same example.
futures-util.workspace = true
# Inference trait impls (async fn in trait) in the same example.
async-trait.workspace = true
