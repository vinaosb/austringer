[package]
name = "harness-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Media family topology (plan M1): every codec family is opt-in; the empty
# default keeps the crate (and anything that depends on it) free of format
# codecs until a caller names the families it wants.
#
# The daemon's `media-core` set is:
#     image, svg, pdf, audio, office, gltf, georaster, data, text
# `avif` and `geovector` are deliberately NON-DEFAULT opt-ins (avif carries
# rav1e's 10-25 MB encoder; geovector carries rusqlite's bundled sqlite3.c,
# the single digest-sanctioned C build, which must stay out of the default
# tree). The M27 honesty matrix discloses feature-gated rows as such.
default = []
image = []
svg = ["dep:quick-xml", "dep:usvg"]
# M12 gltf lane: read via the khronos-ecosystem `gltf` crate (import-only
# by design); write via its re-exported gltf-json serde types + Glb
# container writer. default-features=false keeps the `image` crate (a
# raster codec, out of this module's lane) out of the tree; `names`
# exposes the name fields the name-keyed tree view needs.
gltf = ["dep:gltf", "dep:base64"]
# M13 pdf lane: lopdf for the extract surface (DOM + ToUnicode text decode),
# krilla for the writer (subsetted embedded fonts + ToUnicode CMaps). Both
# pure Rust; rationale recorded in src/adapter/pdf.rs module docs.
pdf = ["dep:lopdf", "dep:krilla"]
audio = []
# M2: the OOXML zip lane reads the central directory via the zip crate
# (pure-Rust deflate backend); without this feature a zip is honestly
# Unknown with a note naming it.
office = ["dep:zip"]
avif = []
georaster = []
geovector = []
data = []
# M30 text-substrate lane: comrak (CommonMark 0.31.2 + GFM) for markdown
# parse/render; maud for self-contained single-file HTML5 generation
# (compile-time templates, escaping built in); html5gum for the html5
# reparse/tag-census (tokenizer-only by design - a full DOM tree is
# unnecessary for a census and tokenizer-only is the bounded untrusted-
# input posture); csv for RFC 4180; toml for TOML 1.0. All pure Rust.
text = ["dep:comrak", "dep:maud", "dep:html5gum", "dep:csv", "dep:toml"]

[dependencies]
harness-core = { path = "../harness-core", version = "0.1.0" }
# M15 tool executor: sandbox policy vocabulary + the promoted supply-chain
# primitives (ReleaseAsset/verify_sha256/redact_env - plan decision 5).
harness-safety = { path = "../harness-safety", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# M10 resolve pipeline: wall-clock timeouts around model-mediated
# projection calls (workspace baseline already carries sync/time/macros).
tokio = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
# M12: khronos glTF 2.0 reader (pure Rust; validated by cargo-deny).
# default-features off: the `import` feature pulls the image crate.
gltf = { version = "1.4.1", default-features = false, features = ["names"], optional = true }
# M12: .gltf writer inlines the buffer as a base64 data URI.
base64 = { version = "0.22", default-features = false, features = ["std"], optional = true }
# M13: >=0.42 required - 0.40/0.41 carry RUSTSEC-2026-0187 (stack
# overflow in load_mem via deeply nested objects - this adapter's exact
# untrusted-parse surface).
lopdf = { version = "0.42", default-features = false, optional = true }
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"], optional = true }
# M11 svg adapter: quick-xml pulls the structure walk (pure Rust, no
# default features - utf8 in, no encoding_rs); usvg is the digest's
# stage-1 strict-parse verify hook (text-less: font-dependent rendering is
# the deferred resvg stage, so no fontdb/harfrust tree lands here).
quick-xml = { version = "0.42", default-features = false, optional = true }
usvg = { version = "0.48", default-features = false, optional = true }
# M30: CommonMark 0.31.2 + GFM parse/render (BSD-2-Clause; cmark-gfm
# port; default features are the builder API only - no syntect/clap
# trees).
comrak = { version = "0.55", default-features = false, optional = true }
# M30: compile-time HTML templates for the self-contained single-file
# html5 writer (escaping is built into text interpolation).
maud = { version = "0.27", optional = true }
# M30: WHATWG-conforming html5 tokenizer for the tag-census extract +
# reparse verify (zero-dep beyond jetscii SIMD scanning).
html5gum = { version = "0.8", default-features = false, optional = true }
# M30: RFC 4180 CSV read/write (MIT OR Unlicense; the OR satisfies the
# deny allow-list via MIT).
csv = { version = "1.4", optional = true }
# M30: TOML 1.0 parse/display (workspace-pinned).
toml = { workspace = true, optional = true }

[dev-dependencies]
# Self-reference so a bare `cargo nextest run -p harness-media` compiles
# the integration tests with the landed adapter features on
# (feature-unification across dev-deps); the library default stays
# feature-empty. Append per-lane features as their todos land.
harness-media = { path = ".", features = ["office", "pdf", "gltf", "svg", "text"] }
# M10 pipeline tests: scripted Inference impls + async test runtime.
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile.workspace = true
# M15 tool-executor tests: mocktool stand-in + synthetic install-pin
# digests.
harness-test-support = { path = "../harness-test-support", version = "0.1.0" }
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
# M15 kill-tree: Job Object (KILL_ON_JOB_CLOSE) tree termination.
win32job.workspace = true

[target.'cfg(unix)'.dependencies]
# M15 kill-tree: process-group kill of the session leader.
libc.workspace = true
