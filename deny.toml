# cargo-deny configuration (validated with cargo-deny 0.20.x).
#
# The workspace currently has ZERO dependencies, so every check passes
# trivially. This file exists to gate dependency introduction from todo 4
# onward: advisories (RustSec), bans (duplicates/wildcards), and licenses.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Deliberate, reviewed additions (todo M13, evidence task-M13-media-formats):
# krilla 0.8.2's text shaping rides rustybuzz (and lopdf's font lane rides
# ttf-parser); both crates are UNMAINTAINED-not-vulnerable (announced
# upstream), ship in no untrusted-input parse lane (shaping runs only on
# validated generation specs; lopdf's parser is the audit surface and its
# RUSTSEC-2026-0187 stack-overflow vuln is FIXED by the 0.42 pin), and have
# no in-tree upgrade path short of dropping the digest-verified writer.
# Revisit when krilla migrates to harfrust.
ignore = [
    "RUSTSEC-2026-0206", # rustybuzz unmaintained
    "RUSTSEC-2026-0192", # ttf-parser unmaintained
]

# Licenses: dual MIT OR Apache-2.0 project. The allow-list below covers the
# permissive licenses commonly carried by Rust dev-dependencies; anything
# outside this list must be a deliberate, reviewed addition.
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    # Deliberate, reviewed addition (todo 43): dhat-rs (heap profiling for
    # the perf gate) is MPL-2.0 — file-level copyleft, used as an OPTIONAL
    # dev/bin-only dependency of harness-bench behind its `dhat` feature;
    # no dhat code ships in any default build or distributed binary.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
