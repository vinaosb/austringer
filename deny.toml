# cargo-deny configuration (validated with cargo-deny 0.20.x).
#
# The workspace currently has ZERO dependencies, so every check passes
# trivially. This file exists to gate dependency introduction from todo 4
# onward: advisories (RustSec), bans (duplicates/wildcards), and licenses.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Deliberate, reviewed additions (todo M13, evidence task-M13-media-formats):
# krilla 0.8.2's text shaping rides rustybuzz (and lopdf's font lane rides
# ttf-parser); both crates are UNMAINTAINED-not-vulnerable (announced
# upstream), ship in no untrusted-input parse lane (shaping runs only on
# validated generation specs; lopdf's parser is the audit surface and its
# RUSTSEC-2026-0187 stack-overflow vuln is FIXED by the 0.42 pin), and have
# no in-tree upgrade path short of dropping the digest-verified writer.
# Revisit when krilla migrates to harfrust.
ignore = [
    "RUSTSEC-2026-0206", # rustybuzz unmaintained
    "RUSTSEC-2026-0192", # ttf-parser unmaintained
    # Deliberate, reviewed addition (todo M28, evidence
    # task-M28-media-formats): rav1e (the pure-Rust AV1 encoder behind
    # the non-default `avif` feature) macro-generates its asm channel
    # tables through `paste`, which is UNMAINTAINED-not-vulnerable
    # (RUSTSEC-2024-0436); it is a build-time proc-macro with no runtime
    # surface, and no upgrade path exists until rav1e migrates.
    "RUSTSEC-2024-0436", # paste unmaintained (via rav1e, avif feature)
]

# Licenses: dual MIT OR Apache-2.0 project. The allow-list below covers the
# permissive licenses commonly carried by Rust dev-dependencies; anything
# outside this list must be a deliberate, reviewed addition.
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    # Deliberate, reviewed addition (todo 43): dhat-rs (heap profiling for
    # the perf gate) is MPL-2.0 ï¿½?" file-level copyleft, used as an OPTIONAL
    # dev/bin-only dependency of austringer-bench behind its `dhat` feature;
    # no dhat code ships in any default build or distributed binary.
    "MPL-2.0",
    # Deliberate, reviewed addition (todo M28, evidence
    # task-M28-media-formats): jpeg-encoder (the plan-mandated pure-Rust
    # JPEG writer) carries "(MIT OR Apache-2.0) AND IJG" - the
    # Independent JPEG Group License is FSF Free/Libre and permissive
    # (the JPEG family's digest-3.2 GREEN verdict predates it).
    "IJG",
    # Deliberate, reviewed addition (todo M28): rav1e (non-default `avif`
    # feature) pulls libfuzzer-sys carrying "(MIT OR Apache-2.0) AND
    # NCSA" - the NCSA/Illinois license is BSD-style permissive with an
    # attribution clause; build-lane only via rav1e's cargo-fuzz tooling.
    "NCSA",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path-only deps (no version key) are the crates.io publish escape for
# the daemon<->web dev-cycle: cargo strips version-less PATH dev-deps
# from packaged manifests, so austringer-web can publish before
# austringer-daemon exists on the registry (receipt: the 0.1.3 publish
# deadlock, 2026-10-30). Registry wildcards stay denied.
allow-wildcard-paths = true
highlight = "all"
