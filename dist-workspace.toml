# cargo-dist workspace configuration.
# Validated with cargo-dist 0.33.0 (latest stable release of
# axodotdev/cargo-dist as verified 2026-09-12 via git ls-remote --tags).
# Docs: https://opensource.axo.dev/cargo-dist/
#
# `dist generate-ci` consumes this file to produce .github/workflows/release.yml.
# Regenerate after editing: `dist generate-ci` (cargo-dist 0.33.0 binary).

[workspace]
# Import the Cargo workspace at the repo root (dist's "cargo:" source).
members = ["cargo:."]

[dist]
# Pinned: the release workflow installs exactly this version.
cargo-dist-version = "0.33.0"
ci = ["github"]
# Shell installer (macOS/Linux) + PowerShell installer (Windows) +
# Homebrew tap (the codex/goose/Amp distribution channel; formulae
# pushed to vinaosb/homebrew-austringer by the release pipeline).
installers = ["shell", "powershell", "homebrew"]
# Native release targets. The linux/arm64 story is handled by the container
# image (see publish-jobs below), not by native dist artifacts.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Custom publish phase job: builds + pushes the multi-arch (amd64+arm64)
# daemon+CLI container image to GHCR. Reusable workflow file, per
# https://opensource.axo.dev/cargo-dist/book/ci/customizing/
# "homebrew": pushes the generated formulae to vinaosb/homebrew-austringer
# (the tap repo must exist; the job needs a repo-scoped token in the
# HOMEBREW_TAP_TOKEN secret to push cross-repo).
publish-jobs = ["./publish-container", "homebrew"]
# The Homebrew tap the formulae are pushed to (pre-created and empty;
# the publish job authenticates with the HOMEBREW_TAP_TOKEN secret).
tap = "vinaosb/homebrew-austringer"
# PRs touching release config only re-run `dist plan` (cheap dry-run), never
# a full artifact build.
pr-run-mode = "plan"
# The publish-container reusable workflow checks out this private repo,
# and GitHub refuses a called workflow that asks for more than its caller
# grants: contents:read must ride the custom-publish-container job's
# permissions block (a job-level block resets unlisted scopes to none —
# the 2026-09-21 "Repository not found" release failure). Declared here
# so `dist generate-ci` emits it natively instead of as a hand edit that
# regeneration strips (the template-drift CI red).
[dist.github-custom-job-permissions]
# Keyed by the publish-jobs entry name ("./publish-container" ->
# "publish-container"), not the generated job id; the entry REPLACES
# the default { id-token, packages } pair, so all three ride here.
"publish-container" = { contents = "read", "id-token" = "write", packages = "write" }
# dist requires all distable packages to share the release tag's version;
# the whole workspace moves in lockstep at 0.x (workspace.version).
