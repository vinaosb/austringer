[package]
name = "austringer-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Hashline anchors: blake3 of line content (already the workspace hash).
blake3.workspace = true
# Semantic hunk staging: Histogram line diff (workspace-anchored).
imara-diff.workspace = true
# Syntax gate + entity (definition) spans for hunk grouping. Path-local
# (NOT a workspace anchor) so the parallel todo-15 worker and this crate
# cannot collide in the shared [workspace.dependencies] block; the version
# keeps cargo-deny's wildcard ban satisfied.
austringer-ast = { path = "../austringer-ast", version = "0.1.0" }

[dev-dependencies]
tempfile.workspace = true
# Property tests compute real tree-sitter definitions over fixtures.
austringer-ast = { path = "../austringer-ast", version = "0.1.0" }
