[workspace]
resolver = "3"
members = [
    "harness-ast",
    "harness-bench",
    "harness-cli",
    "harness-core",
    "harness-daemon",
    "harness-evals",
    "harness-exec",
    "harness-lsp",
    "harness-mcp",
    "harness-providers",
    "harness-repomap",
    "harness-safety",
    "harness-search",
    "harness-sessions",
    "harness-skills",
    "harness-snapshots",
    "harness-test-support",
    "harness-tools",
    "harness-tui",
    "harness-vfs",
    "harness-web",
]

# harness-vscode is a TypeScript project and deliberately NOT a workspace member.

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/placeholder-org/harness" # placeholder until the canonical repo URL exists (cargo-dist requires a GitHub-shaped URL)

[workspace.dependencies]
# Shared dependency versions. Serialization must stay sorted-key stable:
# never enable serde_json's `preserve_order` feature anywhere (it swaps the
# BTreeMap-backed Map for an insertion-ordered one and breaks the byte-stable
# event format).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
# Todo-8 permission store: bundled compiles the public-domain sqlite3.c
# (no system SQLite). sqlx stays T24's choice; two-wrapper consolidation
# is deferred to T24.
rusqlite = { version = "0.40", features = ["bundled"] }
# Todo-9 provider streams: skipped/malformed SSE events are logged through the
# standard facade (lib never installs a subscriber; embedders own output).
tracing = "0.1"
# Todo-17 lexical search: tantivy BM25 index + ripgrep-family regex streaming.
# Lexical only — vectors/embeddings are plan Scope-OUT. Tantivy defaults are
# trimmed to mmap + lz4 (defaults would pull columnar-zstd-compression, whose
# zstd-sys C build breaks the MSVC toolchain in this environment); no
# stemmer/stopwords extras.
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
tempfile = "3"
# Todo-14 parse/tag engine: tree-sitter facade + the LanguageFn ABI shim that
# every grammar crate returns; grammar crates themselves are optional deps
# local to harness-ast (48 of them, feature-gated per language).
tree-sitter = "0.27"
tree-sitter-language = "0.1"
# Todo-18 RSS-sampled bounded LSP guard: per-process resident-set sampling.
# sysinfo (pure Rust) is chosen over hand-rolled Win32 PSAPI bindings — same
# data, no unsafe; the guard refreshes ONE targeted pid per sample, never the
# whole process table.
sysinfo = "0.39"
# Todo-10 provider adapters: the workspace's first real HTTP client.
# default-features=false + rustls-tls-native-roots keeps the tree off
# native-tls/openssl (C builds) and on rustls/ring only, trusting the OS
# certificate store (enterprise proxies/custom CAs) instead of the bundled
# webpki-roots crate, whose CDLA-Permissive-2.0 data license is outside the
# reviewed deny.toml allow-list. "stream" enables chunked response bodies
# (bytes_stream) for SSE. json/gzip/cookies/charset stay off — the adapters
# serialize their own sorted-key JSON and speak raw SSE.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
# Driving reqwest's futures-core-based chunk streams (StreamExt::next) in the
# production transport; no async runtime alternatives pulled in.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Todo-10 OAuth device-flow PKCE: the S256 challenge is base64url(SHA-256)
# by RFC 7636 — RustCrypto sha2 (pure Rust), not a hand-rolled digest.
sha2 = "0.10"
# base64url encoding of the PKCE challenge (pure Rust, no default features
# needed beyond alloc).
base64ct = { version = "1", default-features = false, features = ["alloc"] }
# Chunk type of reqwest's response byte streams (reqwest 0.12 no longer
# re-exports it); already in the tree transitively via hyper.
bytes = "1"
# Todo-19 PTY pipeline: wezterm's portable-pty is the plan-named PTY
# abstraction (ConPTY on Windows, openpty on Unix) and the only crate that
# exposes the spawned child's process handle (`Child::as_raw_handle`), which
# the kill-tree Job-Object assignment needs. Runtime deps are all permissive
# (winapi/shared_library/nix/filedescriptor/serial2).
portable-pty = "0.9"
# Todo-19 terminal emulation: doy's vt100 grid parser (vte underneath) — the
# screen-delta model renders through its cell grid (ANSI/SGR-free contents,
# incremental state machine, wide-char aware). Chosen over termwiz (full
# wezterm subsystem) and avt (no cell API for final-screen rendering).
vt100 = "0.16"
# Todo-19 Windows kill trees: Job Objects with KILL_ON_JOB_CLOSE +
# assign_process + pid enumeration via a safe wrapper, avoiding hand-rolled
# windows-sys FFI in harness-exec.
win32job = "2"
# Todo-19 Unix kill trees: PR_SET_PDEATHSIG + setpgid/killpg (cfg(unix) only).
libc = "0.2"
# Todo-16 semantic hunk staging: plan-named imara-diff (git-ported Histogram,
# outperforms Myers 10-100% on real code, solid on pathological inputs).
# Pure Rust over hashbrown/memchr already in the tree — no new transitive
# crates; the similar crate is rejected (slower on kernel-scale diffs).
imara-diff = "0.2"
# Todo-21 transactional shadows: reflink-copy drives FICLONE (btrfs/XFS),
# APFS clonefile, and Windows ReFS/Dev Drive block cloning. Its
# reflink_or_copy silently falls back to a plain copy per call, which the
# shadow layer detects via the return value (Ok(None) = reflink,
# Ok(Some(_)) = copy) so the chosen backing is always disclosed honestly.
# Pure Rust; dev-dependency tree adds no C builds.
reflink-copy = "0.1"
# Todo-21 shadow worktree fallback: gitoxide, plan-named over git2 (pure
# Rust, no C deps). Default features are OFF; only `sha1` is added because
# object ids cannot exist without it (gix-hash refuses to build otherwise —
# pure-Rust sha1_smol). The fallback only reads HEAD trees/blobs and writes
# refs through the always-on odb + ref store. gix 0.87 has NO
# linked-worktree *creation* (verified against docs.rs gix-0.87.1), so the
# backing materializes the committed tree itself; "worktree+odb" therefore
# collapses to odb+refs.
gix = { version = "0.87", default-features = false, features = ["sha1"] }

# Todo-24 sessions store: encryption at rest. XChaCha20-Poly1305 AEAD +
# argon2 KDF (both RustCrypto, pure Rust — no new C builds on any OS).
chacha20poly1305 = "0.11"
argon2 = "0.6"
# Todo-24 sessions store: OS entropy for per-session data keys, AEAD
# nonces, and argon2 salts (tiny; already transitively in the tree).
getrandom = "0.3"
# Todo-26 Windows sandbox: restricted-token/AppContainer + ACL enforcement
# (CreateAppContainerProfile, SetEntriesInAclW, CreateProcessW attribute
# list). windows-sys 0.61 is already in the lockfile transitively (via
# sysinfo/win32job trees), so this pins no new vendor code; features select
# only the modules the sandbox touches.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
# Todo-26 OIDC workload-identity signer: HMAC-SHA256 (RFC 4231) for
# short-lived JWTs. RustCrypto, pure Rust; digest already in the tree via
# sha2. ed25519 would add two new crates — HMAC is the minimal honest
# signer for a seam whose transport is not wired yet.
hmac = "0.12"
# Todo-29 MCP integration: rmcp is the official Rust SDK (plan names 3.x).
# Pinned 3.3.0 = current stable (2026-09-10), verified via crates.io. Features:
# client + server + macros (both roles), transport-child-process (client-side
# stdio spawn w/ captured stderr), transport-io (server-side stdio),
# transport-streamable-http-client (transport-agnostic; harness-mcp supplies
# its own backend over the workspace reqwest 0.12 so rmcp's optional reqwest
# 0.13 + its TLS stack stay OUT of the tree), transport-streamable-http-server
# (StreamableHttpService for the daemon's HTTP surface). Pure Rust tree; the
# `reqwest`/native-tls rmcp features are deliberately NOT enabled.
rmcp = { version = "3.3", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-io", "transport-streamable-http-server"] }
# rmcp's StreamableHttpClient trait names http::{HeaderName,HeaderValue} in its
# signature and sse_stream::{Sse,Error} in its stream type; both are already in
# the lockfile transitively via rmcp — declared here because harness-mcp's own
# backend implements the trait.
http = "1"
sse-stream = "0.2"
# Todo-29 file-based multi-provider MCP manager: TOML is one of the scanned
# config dialects (.harness format). toml_edit-backed, pure Rust. Note toml
# 0.9 parses documents via toml::Table (Value's FromStr takes bare values).
toml = "0.9"
# Todo-29 org allowlist URL matching + HTTP entry validation: scheme/host/port
# comparison must be real URL parsing, not string prefixing (secure matching).
url = "2"
# Todo-27 permission grammar: OPT-IN regex rules (regex off by default;
# prefix matching is the default mode). Already in the lockfile via the
# grep-regex tree, so this pins no new vendored code.
regex = "1"
# Todo-29 reference MCP server tool args: rmcp's #[tool] macro requires
# JsonSchema derives whose generated code names the schemars crate
# directly (the rmcp re-export is not enough); same 1.x line rmcp 3.3 uses.
schemars = "1"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# `clippy::all` is the real clippy group; `clippy::warnings` does not exist
# (rustc's `warnings` group above already escalates default-warn clippy lints).
all = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
