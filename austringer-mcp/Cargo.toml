[package]
name = "austringer-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
austringer-core = { path = "../austringer-core", version = "0.1.0" }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sse-stream = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "rt"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
axum = "0.8"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "io-std", "rt-multi-thread"] }
tracing-subscriber = "0.3"

# Reference server for MCP integration tests, not a release artifact —
# cargo-dist must skip it.
[package.metadata.dist]
dist = false
