[package]
name = "harness-evals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Dataset/case + report documents are JSON (sorted-key stable per the
# workspace serialization rule; serde_json without preserve_order).
serde.workspace = true
serde_json.workspace = true
# Typed errors throughout; bounded details never ride raw documents.
thiserror.workspace = true
# Dataset content hashing for stale-cache detection (todo 44 stale_state).
blake3.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Hermetic conformance sweep driver (todo 26): runs the committed
# scenario pack under the scripted fake provider. Dev/CI tooling, not
# a release artifact — cargo-dist must skip it (harness-bench
# precedent).
[[bin]]
name = "run_sweep"

[package.metadata.dist]
dist = false
