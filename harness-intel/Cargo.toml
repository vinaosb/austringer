[package]
name = "harness-intel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Read-only consumption of the verified T9/T10 surfaces: ModelIdentity,
# Usage, FinishReason. default-features = false keeps reqwest OUT of this
# crate's tree — the profiles layer is catalog + analysis, never transport;
# "must NOT share data externally" (plan todo 34) is enforced structurally
# by zero network-capable dependencies.
harness-providers = { path = "../harness-providers", version = "0.1.0", default-features = false }
# A/B winner proposals are typed in the Skill Forge's own proposal
# vocabulary (todo 31): intel PRODUCES DistillProposals, the forge's trust
# gates consume them. Direction is one-way; intel has no activation path.
harness-skills = { path = "../harness-skills", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true

[dev-dependencies]
tempfile.workspace = true
