[package]
name = "austringer-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
austringer-core = { path = "../austringer-core", version = "0.1.0" }
# Todo-22 pre-flight (a): the AST gate — touched-file parse validation
# (is_error/is_missing diagnostics) over the default grammar set.
austringer-ast = { path = "../austringer-ast", version = "0.1.0" }
# Todo-22 pre-flight: gates run INSIDE a T21 shadow; the corrective cycle
# revises applied edits through ShadowHandle and the caller commits after.
austringer-vfs = { path = "../austringer-vfs", version = "0.1.0" }
# Todo 4 (ecosystem alignment): the spawn seam accepts the safety
# policy's EnvScrub and removes dropped variables from the child's
# inherited environment (dependency direction exec -> safety is the
# sanctioned one; safety never depends on exec).
austringer-safety = { path = "../austringer-safety", version = "0.1.0" }
portable-pty.workspace = true
vt100.workspace = true
blake3.workspace = true
thiserror.workspace = true
# Todo-22 pre-flight (c): cargo-check structured extraction parses the
# T19-bounded screen text for brace-balanced JSON diagnostic objects.
serde_json.workspace = true
# Todo-22 jsonscan: typed Deserialize structs for cargo diagnostic objects.
serde.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
sysinfo.workspace = true
tempfile.workspace = true
