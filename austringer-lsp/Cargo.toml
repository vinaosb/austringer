[package]
name = "austringer-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Spawned servers write tracing events on the standard facade only; the lib
# never installs a subscriber (embedders own output).
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util"] }
# RSS-sampled bounded-LSP guard: single-pid resident-set sampling.
sysinfo.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util", "process", "io-util"] }
